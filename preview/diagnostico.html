<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico | Brújula Digital</title><link rel="icon" href="brand-mark.svg"><style>:root{--ink:#092b4c;--blue:#1664e8;--cyan:#09b8c6;--paper:#f7fbff;--muted:#55708c;--line:#d9e7f2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:auto}.top{padding:25px 0}.brand{display:flex;align-items:center;gap:10px;font-weight:850;text-decoration:none;color:var(--ink)}.brand img{width:38px}.brand b{color:var(--blue)}main{padding:55px 0 100px}.kicker{text-transform:uppercase;letter-spacing:.18em;font-size:.7rem;font-weight:850;color:var(--blue)}h1{font-size:clamp(2.7rem,7vw,5rem);line-height:.94;letter-spacing:-.08em;margin:18px 0}.intro{color:var(--muted);font-size:1.1rem}.panel{margin-top:38px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px}.panel h2{font-size:1.25rem;margin:0 0 20px}.choices{display:grid;gap:10px}.choice{border:1px solid var(--line);border-radius:11px;padding:16px;text-align:left;background:#fff;color:var(--ink);font:inherit;font-weight:750;cursor:pointer}.choice:hover,.choice:focus{border-color:var(--blue);outline:3px solid #1664e826}.result{display:none;margin-top:20px;background:#e6faf7;border-left:4px solid var(--cyan);padding:17px;border-radius:8px}.result.show{display:block}.result strong{display:block;font-size:1.1rem;margin-bottom:4px}.result a{color:var(--blue);font-weight:800}@media(max-width:560px){main{padding-top:35px}.panel{padding:20px}}
</style></head><body><header class="wrap top"><a class="brand" href="index.html"><img src="brand-mark.svg" alt=""><span>Brújula <b>Digital</b></span></a></header><main class="wrap"><div class="kicker">Orientación rápida</div><h1>Encuentra por dónde empezar.</h1><p class="intro">Dinos qué quieres mejorar y te indicaremos qué tipo de herramienta conviene explorar primero. Sin registros ni datos personales.</p><section class="panel"><h2>¿Qué te está frenando más?</h2><div class="choices"><button class="choice" data-key="productividad">Me cuesta organizar tareas y prioridades</button><button class="choice" data-key="automatizacion">Repito demasiadas tareas manuales</button><button class="choice" data-key="leads">Pierdo oportunidades o respondo tarde</button><button class="choice" data-key="contenido">Crear contenido me quita demasiado tiempo</button></div><div class="result" id="result" aria-live="polite"></div></section></main><script>const copy={productividad:['Productividad','Empieza explorando herramientas para tareas, proyectos y prioridades.'],automatizacion:['Automatización','Empieza explorando herramientas que conectan aplicaciones y eliminan trabajo manual.'],leads:['Leads y seguimiento','Empieza explorando CRM y soluciones para responder y ordenar oportunidades.'],contenido:['Contenido','Empieza explorando herramientas para crear textos, imágenes y publicaciones.']};document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const c=copy[b.dataset.key],r=document.querySelector('#result');r.innerHTML='<strong>'+c[0]+'</strong>'+c[1]+' <a href="index.html#recursos">Ver orientación →</a>';r.classList.add('show')});</script></body></html>
