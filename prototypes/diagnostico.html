<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Encuentra tu siguiente herramienta · Brújula Digital</title>
  <style>
    :root{--navy:#12355b;--blue:#2563eb;--cyan:#14b8a6;--orange:#f97316;--paper:#f7fbff;--ink:#10233d;--muted:#60738d;--line:#dbe7f4}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Inter,ui-sans-serif,system-ui,sans-serif}
    .shell{max-width:1060px;margin:auto;padding:28px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:80px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}.mark{width:36px;height:36px;border-radius:13px 18px 13px 18px;background:linear-gradient(135deg,var(--blue),var(--cyan));position:relative;transform:rotate(-12deg);box-shadow:0 8px 22px #2563eb33}.mark:after{content:'✦';position:absolute;color:var(--orange);font-size:20px;right:-5px;top:-14px;transform:rotate(12deg)}
    .eyebrow{color:var(--blue);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px}.hero{max-width:700px}.hero h1{font-size:clamp(42px,7vw,78px);line-height:.98;letter-spacing:-.07em;margin:15px 0 22px;max-width:820px}.hero h1 span{color:var(--blue)}.hero p{font-size:19px;color:var(--muted);max-width:610px}.progress{display:flex;gap:8px;margin:46px 0 18px}.progress i{height:5px;flex:1;background:var(--line);border-radius:5px}.progress i.on{background:linear-gradient(90deg,var(--blue),var(--cyan))}.step{font-size:13px;color:var(--muted);margin-bottom:18px}.card{background:white;border:1px solid var(--line);border-radius:28px;padding:clamp(22px,5vw,48px);box-shadow:0 20px 55px #12355b12;max-width:760px}.card h2{margin:0 0 26px;font-size:clamp(25px,4vw,38px);letter-spacing:-.04em}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.choice{border:1px solid var(--line);background:#fff;border-radius:18px;padding:19px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:.2s transform,.2s border-color,.2s box-shadow}.choice:hover,.choice:focus-visible{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 9px 24px #2563eb18;outline:3px solid #2563eb22}.choice strong{display:block;margin-bottom:4px}.choice small{color:var(--muted)}.choice.selected{border-color:var(--cyan);background:#effdfa}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.btn{border:0;border-radius:999px;padding:13px 21px;background:var(--blue);color:white;font-weight:800;cursor:pointer;box-shadow:0 10px 22px #2563eb33}.btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}.back{background:transparent;color:var(--muted);box-shadow:none}.result{display:none}.result.show{display:block}.result h2{max-width:570px}.recommend{border-top:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;gap:20px;align-items:center}.pill{color:#087f73;background:#e5faf6;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.disclosure{font-size:12px;color:var(--muted);margin-top:22px}.hide{display:none!important}@media(max-width:620px){.shell{padding:20px 16px 50px}.top{margin-bottom:54px}.choices{grid-template-columns:1fr}.card{border-radius:22px;padding:22px}.hero p{font-size:17px}.recommend{display:block}.recommend .btn{margin-top:12px;width:100%}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span><span>Brújula Digital</span></div><span class="eyebrow">Diagnóstico breve</span></header>
    <section class="hero"><div class="eyebrow">Herramientas · acción · resultados</div><h1>Encuentra el siguiente <span>paso digital</span>.</h1><p>Responde tres preguntas y te orientaremos hacia herramientas que pueden ayudarte a trabajar con más claridad.</p></section>
    <div class="progress" aria-hidden="true"><i class="on"></i><i></i><i></i></div><div class="step" id="step-label">Pregunta 1 de 3</div>
    <section class="card" id="quiz" aria-live="polite"></section>
    <section class="card result" id="result" aria-live="polite"></section>
  </main>
  <script>
    const qs=[
      {id:'pain',q:'¿Qué te está haciendo perder más tiempo ahora?',o:[['organizacion','Tareas e información dispersas','Quiero recuperar foco y orden'],['leads','Consultas sin seguimiento','Quiero responder y organizar oportunidades'],['automatizacion','Tareas repetitivas','Quiero reducir trabajo manual'],['marketing','Crear contenido','Quiero publicar con más consistencia']]},
      {id:'context',q:'¿Cómo trabajas principalmente?',o:[['solo','Por mi cuenta','Profesional independiente'],['equipo_pequeno','Con un pequeño equipo','Varias personas coordinándose'],['empresa_pequena','En una pequeña empresa','Un proceso comercial compartido']]},
      {id:'level',q:'¿Qué nivel de cambio buscas?',o:[['inicial','Algo sencillo para empezar','Pocas decisiones y pasos claros'],['intermedio','Conectar herramientas','Ya uso algunas herramientas'],['avanzado','Procesos completos','Quiero automatizar más']]}
    ]; let step=0,answers={}; const quiz=document.querySelector('#quiz'), result=document.querySelector('#result'), bars=[...document.querySelectorAll('.progress i')];
    function render(){const x=qs[step];document.querySelector('#step-label').textContent=`Pregunta ${step+1} de ${qs.length}`;bars.forEach((b,i)=>b.classList.toggle('on',i<=step));quiz.innerHTML=`<h2>${x.q}</h2><div class="choices">${x.o.map(o=>`<button class="choice ${answers[x.id]===o[0]?'selected':''}" data-value="${o[0]}"><strong>${o[1]}</strong><small>${o[2]}</small></button>`).join('')}</div><div class="actions"><button class="btn back ${step?'':'hide'}" id="back">Volver</button><button class="btn" id="next" ${answers[x.id]?'':'disabled'}>${step===qs.length-1?'Ver orientación':'Continuar'}</button></div>`;quiz.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{answers[x.id]=b.dataset.value;render()});quiz.querySelector('#back')?.addEventListener('click',()=>{step--;render()});quiz.querySelector('#next').addEventListener('click',()=>step===qs.length-1?showResult(): (step++,render()));}
    function showResult(){quiz.classList.add('hide');document.querySelector('#step-label').textContent='Tu orientación';bars.forEach(b=>b.classList.add('on'));const map={organizacion:['productividad','Ordena tu trabajo y recupera foco.','Empieza por una herramienta sencilla para centralizar tareas, proyectos y calendario.'],leads:['leads','Centraliza consultas y evita perder seguimientos.','Busca un CRM o sistema de atención que haga visible el próximo paso.'],automatizacion:['automatizacion','Reduce tareas manuales entre herramientas.','Prioriza un flujo repetitivo y conecta solo las herramientas necesarias.'],marketing:['marketing','Crea materiales con más consistencia.','Empieza por una herramienta de contenido que reduzca el tiempo de preparación.']};const r=map[answers.pain]||map.organizacion;result.innerHTML=`<div class="eyebrow">Resultado orientativo</div><h2>${r[1]}</h2><p>${r[2]}</p><div class="recommend"><div><span class="pill">${r[0]}</span><strong style="display:block;margin-top:8px">Ver soluciones verificadas para este problema</strong></div><button class="btn" onclick="location.href='/herramientas/?necesidad=${r[0]}'">Explorar herramientas</button></div><p class="disclosure">Las recomendaciones son editoriales. Cuando exista una relación de afiliación, la mostraremos de forma clara en la ficha correspondiente.</p>`;result.classList.add('show');}
    render();
  </script>
</body>
</html>
